name: Publish new theme version

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            theme.css
