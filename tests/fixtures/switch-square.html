<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Xuan switch square fixture</title>
    <style>
      body {
        margin: 0;
        width: 240px;
        height: 132px;
        display: grid;
        place-items: center;
        background: #f7f3ed;
      }

      body {
        --toggle-width: 56px;
        --toggle-height: 30px;
        --toggle-thumb-width: 28px;
        --toggle-thumb-height: 28px;
        --toggle-radius: 9999px;
        --toggle-thumb-radius: 9999px;
      }

      body .checkbox-container {
        position: relative;
        display: inline-block;
        width: var(--toggle-width);
        min-width: var(--toggle-width);
        height: var(--toggle-height);
        min-height: var(--toggle-height);
        border-radius: var(--toggle-radius);
        background: #ead2cf;
      }

      body .checkbox-container::after {
        content: "";
        position: absolute;
        display: block;
        width: var(--toggle-thumb-width);
        height: var(--toggle-thumb-height);
        top: 1px;
        left: 27px;
        border-radius: var(--toggle-thumb-radius);
        background: white;
      }
    </style>
    <link rel="stylesheet" href="../../theme.css" />
    <style>
      /* Simulate a late Obsidian/app rule. Theme switch rules must still win. */
      body .checkbox-container {
        border-radius: 9999px;
      }

      body .checkbox-container::after {
        border-radius: 50%;
        top: 50% !important;
        transform: translateX(20px) !important;
      }
    </style>
  </head>
  <body class="theme-light">
    <div id="switch" class="checkbox-container is-enabled"></div>
  </body>
</html>
